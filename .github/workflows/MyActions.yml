# This is a basic workflow to help you get started with Actions

name: MyPetProjectDeploy

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'docker/nginx/**'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  #========CI=======
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find ./app -name '*.php' -print0 | xargs -0 -n1 php -l
  build:
    name: Build Docker images
    needs: tests
    runs-on: ubuntu-latest
    permissions: # нужны для Login to GHCR
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push php docker
        uses: docker/build-push-action@v7
        with:
          context:
          file: ./docker/php/Dockerfile
          push: true
          tags: |
            ghcr.io/rogotochka/php:${{ github.sha }}
            ghcr.io/rogotochka/php:latest
      - name: Push nginx docker
        uses: docker/build-push-action@v7
        with:
          context:
          file: ./docker/nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/rogotochka/nginx:${{ github.sha }}
            ghcr.io/rogotochka/nginx:latest
  #========CD=======
  deploy:
    runs-on: ubuntu-latest
    needs: build 
    steps: 
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Ansible
        run: |
          pip install ansible==13.7.0
          pip install ansible-lint
          ansible-galaxy collection install -r ansible/requirements.yml # download collections
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          mkdir -m 700 -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
  
      - name: Deploy with Ansible
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          IMAGE_VERSION: ${{ secrets.IMAGE_VERSION || 'latest' }} # Если передан sha commit-а запускать ту версию(так сказать rollback)

        run: |
          set -euo pipefail
          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          test -n "$GHCR_READ_TOKEN"
          test -n "$POSTGRES_PASSWORD"
          ansible-playbook \
            -i "${PROD_HOST}," \
            -u "$PROD_USER" \
            --private-key ~/.ssh/id_ed25519 \
            ansible/deploy.yml
        
