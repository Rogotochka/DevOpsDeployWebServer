# This is a basic workflow to help you get started with Actions

name: MyPetProjectDeploy

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  #========CI=======
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax check
        run: find ./app -name '*.php' -print0 | xargs -0 -n1 php -l
  build:
    name: Build Docker images
    needs: tests
    runs-on: ubuntu-latest
    permissions: # нужны для Login to GHCR
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push php docker
        uses: docker/build-push-action@v7
        with:
          context:
          file: ./docker/php/Dockerfile
          push: true
          tags: |
            ghcr.io/rogotochka/php:${{ github.sha }}
            ghcr.io/rogotochka/php:latest
      - name: Push nginx docker
        uses: docker/build-push-action@v7
        with:
          context:
          file: ./docker/nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/rogotochka/nginx:${{ github.sha }}
            ghcr.io/rogotochka/nginx:latest
  #========CD=======
  deploy:
    runs-on: ubuntu-latest
    needs: build 
    steps: 
      - uses: actions/checkout@v4
      - name: "Install Ansible"
        uses: alex-oleshkevich/setup-ansible@VERSION 
        with:
          version: "9.3.0"
          
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.MY_SERVER_PRIVATE_KEY }}
          known_hosts: ${{ secrets.MY_KNOWN_HOSTS }}
          
      - name: Deploy with Ansible
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: echo "test"
        
